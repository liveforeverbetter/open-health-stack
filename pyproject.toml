[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wellnizz-local"
version = "0.1.0"
description = "Local-first personal health data store with a verifiable, hash-linked access log. Educational, not medical advice."
readme = "README.md"
urls = { Repository = "https://github.com/liveforeverbetter/open-health-stack" }
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []  # standard library only
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
wellnizz-local = "wellnizz_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wellnizz_local.reference" = ["*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
